// Deck <-> robot interface v1: camera.
syntax = "proto3";
package remote_joy.v1;

// rj/v1/video: robot -> Deck, best effort, <= 30 fps, only while a Deck subscribes.
message VideoFrame {
  enum Codec {
    CODEC_UNSPECIFIED = 0;
    JPEG = 1;
  }
  uint32 frame_id              = 1;
  uint64 capture_time_us       = 2;  // robot monotonic clock
  uint32 encode_done_offset_us = 3;  // capture -> encode finished
  uint32 width                 = 4;
  uint32 height                = 5;
  Codec  codec                 = 6;
  bytes  data                  = 7;  // one complete JPEG
  uint32 level                 = 8;  // adaptive rate level: 0 = configured rate, higher = reduced (minor 1)
}

// rj/v1/video_feedback: Deck -> robot, best effort, every 200 ms once a VideoFrame has arrived
// (minor 1). deck_video works out each frame's delay on its own clock from it:
// arrival of this message - send time of last_frame_id - last_frame_age_us. No clock sync needed.
message VideoFeedback {
  fixed32 session_id        = 1;
  uint32  last_frame_id     = 2;  // newest VideoFrame.frame_id received
  uint32  last_frame_age_us = 3;  // Deck time from receiving that frame to sending this message
  uint32  frames_received   = 4;  // VideoFrames received this session (wraps); vs frame_id gaps = loss
}
