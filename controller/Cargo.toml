# Steam Deck app (no ROS). See docs/controller.md.
[workspace]
resolver = "2"
members = ["deck_msgs", "deck_core", "deck_app"]

[workspace.package]
edition = "2021"
version = "0.1.0"
license = "TODO"

[workspace.dependencies]
prost = "0.14"
prost-build = "0.14"
protox = "0.10"
deck_msgs = { path = "deck_msgs" }
deck_core = { path = "deck_core" }
# Exact pin = `crates` in interface/ZENOH_VERSION; Cargo.lock must hold quinn-proto >= 0.11.18
# (deck_core/tests/pins.rs). "unstable" gives per-publisher reliability.
zenoh = { version = "=1.10.2", features = ["unstable"] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
tar = "0.4"
sha2 = "0.10"
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
eframe = "0.37"
gilrs = "0.11"
zune-jpeg = "0.4"

[profile.release]
strip = true
