# teleop_twist_joy for the demo, using the Deck layout from docs/interface.md.
# turtlesim takes plain Twist, so publish_stamped_twist stays false.
teleop_twist_joy_node:
  ros__parameters:
    require_enable_button: true
    enable_button: 9          # LB (deadman)
    enable_turbo_button: 10   # RB (turbo)
    axis_linear:
      x: 1                    # left stick Y
    scale_linear:
      x: 2.0
    scale_linear_turbo:
      x: 4.0
    axis_angular:
      yaw: 2                  # right stick X (left = +)
    scale_angular:
      yaw: 2.0
    scale_angular_turbo:
      yaw: 4.0
    publish_stamped_twist: false
