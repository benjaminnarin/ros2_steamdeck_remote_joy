# teleop_twist_joy with the Deck layout (docs/interface.md § Axis and button indices).
# Speeds are placeholders: set them for your robot. publish_stamped_twist comes from the
# launch argument cmd_vel_stamped.
teleop_twist_joy_node:
  ros__parameters:
    require_enable_button: true
    enable_button: 21         # "deadman held", made by deck_gateway (default deadman: L2 trigger)
    enable_turbo_button: 10   # RB: deck_gateway only passes it while the deadman is held
    axis_linear:
      x: 1                    # left stick Y
    scale_linear:
      x: 0.5
    scale_linear_turbo:
      x: 1.0
    axis_angular:
      yaw: 2                  # right stick X (left = +)
    scale_angular:
      yaw: 1.0
    scale_angular_turbo:
      yaw: 2.0
